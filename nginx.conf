# =============================================================================
# loghub-ui — Nginx: serve o build via HTTPS e proxia /api pro loghub-api
#
# loghub-api roda em HTTP puro (network_mode: host, sem TLS) — chamar ele direto
# do browser a partir desta página (servida em HTTPS) é bloqueado como mixed
# content. Por isso o proxy: nginx termina TLS aqui e repassa pro loghub-api em
# HTTP puro via 172.19.0.1 (gateway da rede loghub-network), mesmo padrão já
# usado pelo aque-web pro aque-backend. LOGHUB_API_URL (env-config.js) passa a
# ser um path relativo (/api/logs), sem host/porta.
#
# server_name genérico: só existe um vhost por porta, então qualquer Host serve —
# a mesma imagem funciona pra qualquer IP/hostname de deploy, sem rebuild.
# =============================================================================

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/loghub.crt;
    ssl_certificate_key /etc/nginx/certs/loghub.key;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — redireciona todas as rotas para o index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gerado por container (docker-entrypoint.d/40-env-config.sh) a cada start —
    # nunca deixar o browser cachear entre deploys, senão ele continua batendo
    # numa config antiga (URL/porta velha) mesmo depois de corrigida no servidor.
    location = /env-config.js {
        add_header Cache-Control "no-cache";
    }

    # Proxy reverso para o loghub-api (network_mode: host, alcançado via gateway
    # da rede loghub-network — mesmo truque usado pro aque-backend chegar no
    # Postgres/loghub-api via 172.18.0.1)
    location /api/ {
        proxy_pass http://172.19.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
